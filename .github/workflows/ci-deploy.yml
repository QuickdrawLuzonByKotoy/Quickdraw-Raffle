name: Deploy Quickdraw to GitHub Pages (24/7)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant GitHub Actions permission to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required project files
        run: |
          test -f public/index.html
          test -f public/supabase-bridge.js
          test -f db/schema.sql
          test -f db/seed.sql

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload /public directory as static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
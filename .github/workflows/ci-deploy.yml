name: Quickdraw CI & Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check server.js syntax
        run: node --check server.js

      - name: Verify frontend and SQL assets exist
        run: |
          test -f public/index.html
          test -f db/schema.sql
          test -f db/seed.sql